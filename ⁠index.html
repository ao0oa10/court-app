<script>
/**
 * -----------------------------------------------------------------------------
 * 1. UTILS & CONSTANTS
 * -----------------------------------------------------------------------------
 */
const Utils = {
    uuid: () => Math.random().toString(36).substring(2, 10),
    showToast: (msg) => {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 3000);
    }
};

const CONSTANTS = {
    ROLES: { plaintiff: 'مدعي', defendant: 'مدعى عليه', intervener: 'خصم مدخل' },
    GENDERS: { M: 'ذكر', F: 'أنثى', C: 'شركة/جهة اعتبارية' },
    COUNTS: { S: 'مفرد', D: 'مثنى', P: 'جمع' },
    ORDERS: { 0: 'بدون ترتيب', 1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع' },
    ATTENDANCE: { yes: 'حضر', no: 'لم يحضر' },
    HOW_ATTENDED: { physical: 'حضوري', virtual: 'اتصال مرئي' },
    REP_TYPES: { self: 'بشخصه', agent: 'وكيل', rep: 'ممثل', manager: 'مدير', gov: 'مستشار إدارة قضايا الحكومة' },
    REQUESTS: { 
        none: 'بدون طلب', 
        reserve: 'حجز الدعوى للحكم', 
        reject: 'رفض الدعوى لعدم قيامها على أساس قانوني', 
        delay: 'أجل للرد والتعقيب', 
        investigate: 'إحالة الدعوى للتحقيق', 
        custom: 'طلب مخصص' 
    }
};

/**
 * -----------------------------------------------------------------------------
 * 2. DATABASE (IndexedDB) - الأرشيف
 * -----------------------------------------------------------------------------
 */
const DBManager = (() => {
    const DB_NAME = 'LegalMinutesDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'minutes';
    let db = null;

    const init = () => new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(); };
        req.onerror = (e) => reject(e.target.error);
    });

    const save = async (record) => {
        if (!db) await init();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            record.updatedAt = Date.now();
            if(!record.createdAt) record.createdAt = Date.now();
            tx.objectStore(STORE_NAME).put(record);
            tx.oncomplete = () => resolve(record.id);
        });
    };

    const getAll = async () => {
        if (!db) await init();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).getAll();
            req.onsuccess = () => resolve(req.result.sort((a, b) => b.updatedAt - a.updatedAt));
        });
    };

    const get = async (id) => {
        if (!db) await init();
        return new Promise((resolve) => {
            const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(id);
            req.onsuccess = () => resolve(req.result);
        });
    };

    const remove = async (id) => {
        if (!db) await init();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).delete(id);
            tx.oncomplete = () => resolve();
        });
    };

    return { init, save, getAll, get, remove };
})();

/**
 * -----------------------------------------------------------------------------
 * 3. GRAMMAR ENGINE - محرك الصياغة النحوية والقانونية
 * -----------------------------------------------------------------------------
 */
const GrammarEngine = {
    // بناء اسم الطرف بناء على (الدور، النوع، العدد، الترتيب) وحالة الإعراب
    getPartyBaseName: (role, gender, count, isGenitive = false) => {
        if (role === 'plaintiff') {
            if (gender === 'M') {
                if (count === 'S') return 'المدعي';
                if (count === 'D') return isGenitive ? 'المدعيين' : 'المدعيان';
                if (count === 'P') return isGenitive ? 'المدعين' : 'المدعون';
            } else if (gender === 'F') {
                if (count === 'S') return 'المدعية';
                if (count === 'D') return isGenitive ? 'المدعيتين' : 'المدعيتان';
                if (count === 'P') return 'المدعيات';
            } else { // C (شركة/جهة)
                return 'المدعية'; // الشركات تعامل معاملة المؤنث المفرد غالباً
            }
        }
        
        if (role === 'defendant') {
            if (gender === 'M') {
                if (count === 'S') return 'المدعى عليه';
                if (count === 'D') return 'المدعى عليهما';
                if (count === 'P') return 'المدعى عليهم';
            } else if (gender === 'F' || gender === 'C') {
                if (count === 'S') return 'المدعى عليها';
                if (count === 'D') return 'المدعى عليهما';
                if (count === 'P') return 'المدعى عليهن';
            }
        }

        if (role === 'intervener') {
            if (gender === 'M') {
                if (count === 'S') return 'الخصم المدخل';
                if (count === 'D') return isGenitive ? 'الخصمين المدخلين' : 'الخصمان المدخلان';
                if (count === 'P') return isGenitive ? 'الخصوم المدخلين' : 'الخصوم المدخلون';
            } else {
                return 'الجهة المدخلة';
            }
        }
        return '';
    },

    getOrderSuffix: (order, gender) => {
        if (order == 0) return '';
        const mapM = { 1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع' };
        const mapF = { 1: 'الأولى', 2: 'الثانية', 3: 'الثالثة', 4: 'الرابعة' };
        const isF = (gender === 'F' || gender === 'C');
        return isF ? mapF[order] : mapM[order];
    },

    getFullPartyName: (party, isGenitive = false) => {
        const base = GrammarEngine.getPartyBaseName(party.role, party.gender, party.count, isGenitive);
        const suffix = GrammarEngine.getOrderSuffix(party.order, party.gender);
        return `${base} ${suffix}`.trim();
    },

    getPronoun: (gender, count) => {
        if (count === 'D') return 'هما';
        if (count === 'P') return gender === 'F' ? 'هن' : 'هم';
        return (gender === 'F' || gender === 'C') ? 'ها' : 'ه';
    },

    getVerb: (gender, verb) => {
        // الفعل في بداية الجملة الفردية يتبع الجنس فقط وليس العدد
        const isF = (gender === 'F' || gender === 'C');
        if (verb === 'حضر') return isF ? 'حضرت' : 'حضر';
        if (verb === 'طلب') return isF ? 'طلبت' : 'طلب';
        return verb;
    },

    getRepTitle: (repType, repGender) => {
        const isF = (repGender === 'F');
        switch (repType) {
            case 'agent': return isF ? 'وكيلة' : 'وكيل';
            case 'rep': return isF ? 'ممثلة' : 'ممثل';
            case 'manager': return isF ? 'مديرة' : 'مدير';
            case 'gov': return 'مستشار إدارة قضايا الحكومة';
            default: return '';
        }
    }
};

/**
 * -----------------------------------------------------------------------------
 * 4. STATE ENGINE - إدارة الحالة (البيانات)
 * -----------------------------------------------------------------------------
 */
const StateEngine = (() => {
    let currentRecord = null;
    let listeners = [];
    
    // الأقسام المتاحة للتنقل
    const SECTIONS = ['meta', 'parties', 'attendance', 'requests', 'review'];
    let currentSectionIndex = 0;

    const notify = () => {
        if(currentRecord) DBManager.save(currentRecord); // Auto-save on change
        listeners.forEach(fn => fn());
    };

    const getNewParty = (role, order) => ({
        id: Utils.uuid(), role, gender: 'M', count: 'S', order
    });

    const initNew = () => {
        currentRecord = {
            id: Utils.uuid(),
            meta: { caseNum: '', title: '', date: new Date().toISOString().split('T')[0] },
            parties: [getNewParty('plaintiff', 1), getNewParty('defendant', 1)],
            answers: {}, // stores attendance and requests data keyed by party.id
            manualEdit: null
        };
        currentSectionIndex = 0;
        notify();
    };

    const load = (record) => {
        currentRecord = JSON.parse(JSON.stringify(record));
        currentSectionIndex = 0;
        notify();
    };

    const get = () => currentRecord;
    const getCurrentSection = () => SECTIONS[currentSectionIndex];

    const navigate = (direction) => {
        if (direction === 'next' && currentSectionIndex < SECTIONS.length - 1) {
            currentSectionIndex++; notify();
        } else if (direction === 'prev' && currentSectionIndex > 0) {
            currentSectionIndex--; notify();
        }
    };
    
    const jumpToSection = (sectionName) => {
        const idx = SECTIONS.indexOf(sectionName);
        if (idx !== -1) { currentSectionIndex = idx; notify(); }
    };

    // Parties Management
    const addParty = (role) => {
        // Find highest order for this role
        const sameRole = currentRecord.parties.filter(p => p.role === role);
        const newOrder = sameRole.length > 0 ? Math.max(...sameRole.map(p => parseInt(p.order) || 0)) + 1 : 1;
        currentRecord.parties.push(getNewParty(role, newOrder));
        notify();
    };
    const removeParty = (id) => {
        currentRecord.parties = currentRecord.parties.filter(p => p.id !== id);
        delete currentRecord.answers[id];
        notify();
    };
    const updateParty = (id, key, val) => {
        const p = currentRecord.parties.find(x => x.id === id);
        if (p) p[key] = val;
        notify();
    };

    // Answers Management (Attendance, Requests)
    const updateAnswer = (partyId, key, val) => {
        if (!currentRecord.answers[partyId]) currentRecord.answers[partyId] = {};
        
        currentRecord.answers[partyId][key] = val;
        
        // Logical Resets
        if (key === 'attended' && val === 'no') {
            // keep 'attended' only, clear others
            currentRecord.answers[partyId] = { attended: 'no' };
        }
        
        // Auto default repGender if self is chosen
        if (key === 'repType' && val === 'self') {
            const p = currentRecord.parties.find(x => x.id === partyId);
            currentRecord.answers[partyId].repGender = p.gender;
        }

        notify();
    };

    const subscribe = (fn) => listeners.push(fn);

    return { 
        initNew, load, get, getCurrentSection, navigate, jumpToSection, 
        addParty, removeParty, updateParty, updateAnswer, subscribe 
    };
})();


/**
 * -----------------------------------------------------------------------------
 * 5. COMPILER - تجميع النص
 * -----------------------------------------------------------------------------
 */
const Compiler = {
    generateRecordText: (state) => {
        if (!state) return '';
        if (state.manualEdit) return state.manualEdit; // Return manual edit if exists

        let attLines = [];
        let reqLines = [];
        const parties = state.parties || [];
        
        // Check "All Absent" rule
        const allAbsent = parties.every(p => !state.answers[p.id] || state.answers[p.id].attended === 'no');
        
        if (allAbsent && parties.length > 0) {
            attLines.push("لم يحضر أحد.");
        } else {
            parties.forEach(p => {
                const ans = state.answers[p.id];
                if (!ans) return;

                // 1. Attendance
                if (ans.attended === 'no') {
                    const verb = GrammarEngine.getVerb(p.gender, 'لم يحضر'); // لم يحضر / لم تحضر
                    attLines.push(`${verb} ${GrammarEngine.getFullPartyName(p, false)}.`);
                } else if (ans.attended === 'yes') {
                    let sentence = "";
                    const actualGender = ans.repType === 'self' ? p.gender : (ans.repGender || 'M');
                    const verb = GrammarEngine.getVerb(actualGender, 'حضر'); // حضر / حضرت
                    
                    if (ans.repType === 'self') {
                        const pronoun = GrammarEngine.getPronoun(p.gender, p.count);
                        sentence = `${verb} ${GrammarEngine.getFullPartyName(p, false)} بشخص${pronoun}`;
                    } else if (ans.repType === 'gov') {
                        const repTitle = GrammarEngine.getRepTitle('gov', 'M');
                        sentence = `${verb} ${repTitle} ${ans.repName ? `"${ans.repName}"` : ''} عن ${ans.govEntity ? `"${ans.govEntity}"` : ''}`;
                    } else {
                        const repTitle = GrammarEngine.getRepTitle(ans.repType, ans.repGender);
                        const partyGenitive = GrammarEngine.getFullPartyName(p, true); // المضاف إليه
                        const profTitle = ans.repType === 'agent' ? (ans.repGender === 'F' ? 'الأستاذة' : 'الأستاذ') : '';
                        sentence = `${verb} ${repTitle} ${partyGenitive} ${profTitle} ${ans.repName ? `"${ans.repName}"` : ''}`;
                    }

                    // How
                    if (ans.how === 'virtual') sentence += " عن طريق الاتصال المرئي";
                    
                    // Verify
                    if (ans.verified === 'yes') {
                        const pronoun = GrammarEngine.getPronoun(actualGender, 'S');
                        sentence += ` والمحكمة تحققت من هويت${pronoun} بواقع بطاقة الهوية`;
                    }
                    
                    attLines.push(sentence.replace(/\s+/g, ' ').trim() + ".");
                }

                // 2. Requests
                if (ans.attended === 'yes' && ans.request && ans.request !== 'none') {
                    const actualGender = ans.repType === 'self' ? p.gender : (ans.repGender || 'M');
                    const verb = GrammarEngine.getVerb(actualGender, 'طلب'); // طلب / طلبت
                    
                    let subject = "";
                    if (ans.repType === 'self') {
                        subject = GrammarEngine.getFullPartyName(p, false);
                    } else {
                        const attNoun = actualGender === 'F' ? 'الحاضرة' : 'الحاضر';
                        subject = `${attNoun} عن ${GrammarEngine.getFullPartyName(p, true)}`;
                    }

                    let reqText = ans.request === 'custom' ? (ans.customReq || '[طلب مخصص]') : CONSTANTS.REQUESTS[ans.request];
                    reqLines.push(`و${verb} ${subject} ${reqText}.`);
                }
            });
        }

        let fullText = attLines.join('\n');
        if (reqLines.length > 0) fullText += '\n\n' + reqLines.join('\n');
        
        return fullText.trim();
    }
};

/**
 * -----------------------------------------------------------------------------
 * 6. UI RENDERER - واجهة المستخدم
 * -----------------------------------------------------------------------------
 */
const UIEngine = (() => {
    const container = document.getElementById('app-container');

    // Helper: Choice Chips
    const renderChoices = (options, currentValue, onChangeStr, cols=2) => {
        return `<div class="grid grid-cols-1 sm:grid-cols-${cols} gap-3">
            ${Object.entries(options).map(([k, v]) => `
                <button onclick="${onChangeStr}('${k}')" 
                    class="choice-btn ${currentValue === k ? 'active' : ''}">
                    ${v}
                </button>
            `).join('')}
        </div>`;
    };

    const renderInput = (label, value, onChangeStr, placeholder="") => `
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-600 mb-2">${label}</label>
            <input type="text" value="${value||''}" oninput="${onChangeStr}(this.value)" placeholder="${placeholder}"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent transition">
        </div>
    `;

    const renderStepper = (currentSec) => {
        const steps = [
            { id:'meta', icon:'fa-file-lines', lbl:'البيانات' },
            { id:'parties', icon:'fa-users', lbl:'الأطراف' },
            { id:'attendance', icon:'fa-user-check', lbl:'الحضور' },
            { id:'requests', icon:'fa-comment-dots', lbl:'الطلبات' },
            { id:'review', icon:'fa-print', lbl:'المراجعة' }
        ];
        
        return `
            <div class="bg-white border-b sticky top-0 z-40 px-4 py-3 overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-2 min-w-max">
                    ${steps.map((s, i) => `
                        <button onclick="StateEngine.jumpToSection('${s.id}')" 
                            class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-semibold transition
                            ${currentSec === s.id ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}">
                            <i class="fas ${s.icon}"></i> ${s.lbl}
                        </button>
                        ${i < steps.length - 1 ? '<i class="fas fa-chevron-left text-gray-300 text-xs"></i>' : ''}
                    `).join('')}
                </div>
            </div>
        `;
    };

    const renderArchive = async () => {
        const records = await DBManager.getAll();
        
        container.innerHTML = `
            <div class="max-w-5xl mx-auto p-4 sm:p-8">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                    <h2 class="text-2xl font-bold text-gray-800"><i class="fas fa-archive text-primary ml-2"></i> الأرشيف</h2>
                    <div class="flex gap-2">
                        <button onclick="App.exportBackup()" class="px-4 py-2 bg-white border border-gray-300 rounded shadow-sm hover:bg-gray-50 font-semibold text-sm">
                            <i class="fas fa-download ml-1"></i> تصدير نسخة
                        </button>
                        <label class="px-4 py-2 bg-white border border-gray-300 rounded shadow-sm hover:bg-gray-50 font-semibold text-sm cursor-pointer">
                            <i class="fas fa-upload ml-1"></i> استيراد
                            <input type="file" class="hidden" accept=".json" onchange="App.importBackup(event)">
                        </label>
                    </div>
                </div>

                ${records.length === 0 ? `
                    <div class="text-center py-20 bg-white rounded-xl shadow-sm border">
                        <i class="fas fa-folder-open text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 font-semibold">لا توجد محاضر محفوظة بعد.</p>
                        <button onclick="App.startNew()" class="mt-4 px-6 py-2 bg-accent text-white rounded font-bold hover:bg-blue-600 transition">ابدأ الآن</button>
                    </div>
                ` : `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${records.map(r => `
                            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 hover:shadow-md transition group">
                                <div class="flex justify-between items-start mb-3">
                                    <span class="bg-blue-100 text-primary px-2 py-1 rounded text-xs font-bold">قضية: ${r.meta.caseNum || 'بدون رقم'}</span>
                                    <button onclick="App.deleteRecord('${r.id}')" class="text-red-400 hover:text-red-600 transition opacity-0 group-hover:opacity-100" title="حذف">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                                <h3 class="font-bold text-lg text-gray-800 mb-1 truncate">${r.meta.title || 'محضر جلسة بدون عنوان'}</h3>
                                <p class="text-sm text-gray-500 mb-4"><i class="far fa-calendar ml-1"></i> ${r.meta.date}</p>
                                <button onclick="App.openRecord('${r.id}')" class="w-full py-2 bg-gray-50 text-primary font-semibold rounded hover:bg-primary hover:text-white transition border border-gray-200 group-hover:border-primary">
                                    متابعة التحرير <i class="fas fa-arrow-left mr-1 text-xs"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `}
            </div>
        `;
    };

    const renderEditor = () => {
        const state = StateEngine.get();
        const section = StateEngine.getCurrentSection();
        
        let workAreaHtml = '';

        if (section === 'meta') {
            workAreaHtml = `
                <div class="max-w-2xl mx-auto p-6 fade-enter">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800">بيانات الجلسة الأساسية</h2>
                    <div class="bg-white p-6 rounded-xl shadow-sm border mb-6">
                        ${renderInput('رقم القضية', state.meta.caseNum, `(v) => App.updateMeta('caseNum', v)`)}
                        ${renderInput('تاريخ الجلسة', state.meta.date, `(v) => App.updateMeta('date', v)`)}
                        ${renderInput('عنوان المحضر (اختياري)', state.meta.title, `(v) => App.updateMeta('title', v)`)}
                    </div>
                </div>
            `;
        }

        else if (section === 'parties') {
            workAreaHtml = `
                <div class="max-w-3xl mx-auto p-6 fade-enter">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">إعداد الأطراف</h2>
                        <div class="flex gap-2">
                            <button onclick="StateEngine.addParty('plaintiff')" class="px-3 py-1 bg-green-100 text-green-700 rounded text-sm font-bold hover:bg-green-200">+ مدعي</button>
                            <button onclick="StateEngine.addParty('defendant')" class="px-3 py-1 bg-red-100 text-red-700 rounded text-sm font-bold hover:bg-red-200">+ مدعى عليه</button>
                            <button onclick="StateEngine.addParty('intervener')" class="px-3 py-1 bg-purple-100 text-purple-700 rounded text-sm font-bold hover:bg-purple-200">+ خصم مدخل</button>
                        </div>
                    </div>
                    
                    <div class="space-y-6">
                        ${state.parties.map((p, idx) => `
                            <div class="bg-white p-6 rounded-xl shadow-sm border relative">
                                ${state.parties.length > 1 ? `<button onclick="StateEngine.removeParty('${p.id}')" class="absolute top-4 left-4 text-gray-400 hover:text-red-500"><i class="fas fa-times text-lg"></i></button>` : ''}
                                
                                <h3 class="font-bold text-primary mb-4 text-lg border-b pb-2">
                                    ${GrammarEngine.getFullPartyName(p)}
                                </h3>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-2">الصفة الرئيسية</label>
                                        ${renderChoices(CONSTANTS.ROLES, p.role, `(v) => App.updateParty('${p.id}','role',v)`, 1)}
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-2">الترتيب</label>
                                        ${renderChoices(CONSTANTS.ORDERS, String(p.order), `(v) => App.updateParty('${p.id}','order',v)`, 1)}
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-2">النوع / الجنس</label>
                                        ${renderChoices(CONSTANTS.GENDERS, p.gender, `(v) => App.updateParty('${p.id}','gender',v)`, 1)}
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-2">العدد</label>
                                        ${renderChoices(CONSTANTS.COUNTS, p.count, `(v) => App.updateParty('${p.id}','count',v)`, 1)}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        else if (section === 'attendance') {
            workAreaHtml = `
                <div class="max-w-3xl mx-auto p-6 fade-enter">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">إثبات الحضور</h2>
                    <div class="space-y-6">
                        ${state.parties.map(p => {
                            const ans = state.answers[p.id] || {};
                            let html = `
                                <div class="bg-white p-6 rounded-xl shadow-sm border transition-all duration-300 ${ans.attended === 'no' ? 'opacity-70 grayscale' : ''}">
                                    <h3 class="font-bold text-lg text-primary mb-4 border-r-4 border-primary pr-3">${GrammarEngine.getFullPartyName(p)}</h3>
                                    
                                    <div class="mb-6">
                                        <label class="block text-sm font-bold text-gray-700 mb-2">هل حضر الجلسة؟</label>
                                        ${renderChoices(CONSTANTS.ATTENDANCE, ans.attended, `(v) => App.updateAnswer('${p.id}','attended',v)`)}
                                    </div>
                            `;

                            if (ans.attended === 'yes') {
                                html += `
                                    <div class="space-y-6 border-t pt-6 fade-enter">
                                        <div>
                                            <label class="block text-sm font-bold text-gray-700 mb-2">صفة الحاضر:</label>
                                            ${renderChoices(CONSTANTS.REP_TYPES, ans.repType, `(v) => App.updateAnswer('${p.id}','repType',v)`, 2)}
                                        </div>
                                `;

                                // Details for reps
                                if (ans.repType && ans.repType !== 'self') {
                                    html += `<div class="bg-blue-50/50 p-4 rounded-lg border border-blue-100 space-y-4 fade-enter">`;
                                    
                                    if (ans.repType !== 'gov') {
                                        html += `<div>
                                            <label class="block text-sm font-bold text-gray-700 mb-2">جنس الحاضر (لضبط الصياغة اللغوية)</label>
                                            ${renderChoices({M:'ذكر', F:'أنثى'}, ans.repGender || 'M', `(v) => App.updateAnswer('${p.id}','repGender',v)`)}
                                        </div>`;
                                        html += renderInput('الاسم (اختياري)', ans.repName, `(v) => App.updateAnswer('${p.id}','repName',v)`);
                                    } else {
                                        html += renderInput('اسم المستشار', ans.repName, `(v) => App.updateAnswer('${p.id}','repName',v)`);
                                        html += renderInput('عن إدارة / جهة', ans.govEntity, `(v) => App.updateAnswer('${p.id}','govEntity',v)`);
                                    }
                                    html += `</div>`;
                                }

                                html += `
                                        <div>
                                            <label class="block text-sm font-bold text-gray-700 mb-2">طريقة الحضور:</label>
                                            ${renderChoices(CONSTANTS.HOW_ATTENDED, ans.how, `(v) => App.updateAnswer('${p.id}','how',v)`)}
                                        </div>
                                        <div>
                                            <label class="block text-sm font-bold text-gray-700 mb-2">هل تم التحقق من الهوية؟</label>
                                            ${renderChoices({yes:'نعم، بواقع بطاقة الهوية', no:'لا (أو تخطي)'}, ans.verified, `(v) => App.updateAnswer('${p.id}','verified',v)`)}
                                        </div>
                                    </div>
                                `;
                            }
                            html += `</div>`;
                            return html;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        else if (section === 'requests') {
            const attendees = state.parties.filter(p => state.answers[p.id]?.attended === 'yes');
            
            workAreaHtml = `
                <div class="max-w-3xl mx-auto p-6 fade-enter">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">أقوال وطلبات الأطراف</h2>
                    ${attendees.length === 0 ? `
                        <div class="text-center py-10 bg-white rounded-xl border">لا يوجد أطراف حاضرين لإثبات طلباتهم. سيتم صياغة المحضر كغياب للجميع.</div>
                    ` : `
                        <div class="space-y-6">
                            ${attendees.map(p => {
                                const ans = state.answers[p.id];
                                return `
                                <div class="bg-white p-6 rounded-xl shadow-sm border">
                                    <h3 class="font-bold text-lg text-primary mb-4 border-r-4 border-primary pr-3">طلب ${GrammarEngine.getFullPartyName(p)}</h3>
                                    ${renderChoices(CONSTANTS.REQUESTS, ans.request || 'none', `(v) => App.updateAnswer('${p.id}','request',v)`, 1)}
                                    
                                    ${ans.request === 'custom' ? `
                                        <div class="mt-4 fade-enter">
                                            <textarea oninput="App.updateAnswer('${p.id}','customReq',this.value)" placeholder="اكتب الطلب بدقة هنا..." class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-accent outline-none min-h-[100px]">${ans.customReq || ''}</textarea>
                                        </div>
                                    ` : ''}
                                </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        else if (section === 'review') {
            workAreaHtml = `
                <div class="max-w-3xl mx-auto p-6 fade-enter">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">المراجعة النهائية والتعديل اليدوي</h2>
                    <div class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded-lg mb-6 text-sm">
                        <i class="fas fa-exclamation-triangle mr-1"></i> إذا قمت بتعديل النص يدوياً هنا، سيتوقف التحديث الآلي لتجنب فقدان تعديلاتك.
                    </div>
                    
                    <textarea oninput="App.setManualEdit(this.value)" id="final-text-area"
                        class="w-full h-80 p-6 border rounded-xl focus:ring-2 focus:ring-accent outline-none text-lg leading-loose shadow-inner mb-6" 
                        style="white-space: pre-wrap;">${state.manualEdit || Compiler.generateRecordText(state)}</textarea>
                        
                    ${state.manualEdit ? `
                        <button onclick="App.clearManualEdit()" class="mb-6 text-red-600 hover:underline font-bold text-sm">
                            <i class="fas fa-undo"></i> تراجع عن التعديل اليدوي والعودة للتوليد الآلي
                        </button>
                    ` : ''}

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <button onclick="App.copyText()" class="py-3 bg-gray-800 text-white rounded-lg shadow font-bold hover:bg-gray-700 transition">
                            <i class="fas fa-copy"></i> نسخ النص
                        </button>
                        <button onclick="App.exportPDF()" class="py-3 bg-red-600 text-white rounded-lg shadow font-bold hover:bg-red-700 transition">
                            <i class="fas fa-file-pdf"></i> تصدير PDF
                        </button>
                        <button onclick="window.print()" class="py-3 bg-primary text-white rounded-lg shadow font-bold hover:bg-blue-800 transition">
                            <i class="fas fa-print"></i> طباعة
                        </button>
                    </div>
                </div>
            `;
        }

        // Action Bar (Next/Prev)
        const isFirst = section === SECTIONS[0];
        const isLast = section === SECTIONS[SECTIONS.length - 1];
        
        const actionBar = `
            <div class="fixed lg:absolute bottom-0 left-0 w-full md:w-auto md:right-0 bg-white border-t p-4 flex justify-between z-40" style="bottom: env(safe-area-inset-bottom);">
                <button onclick="StateEngine.navigate('prev')" class="px-6 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300 transition ${isFirst ? 'invisible' : ''}">السابق</button>
                <button onclick="StateEngine.navigate('next')" class="px-8 py-2 bg-primary text-white rounded font-bold hover:bg-blue-800 shadow transition ${isLast ? 'invisible' : ''}">التالي</button>
            </div>
        `;

        // Render full layout
        container.innerHTML = `
            <div class="layout-container">
                <div class="work-area bg-bglight">
                    ${renderStepper(section)}
                    ${workAreaHtml}
                    ${actionBar}
                </div>
                <div class="preview-area shadow-lg">
                    <div class="p-3 bg-gray-800 text-white flex justify-between items-center text-sm font-bold shrink-0">
                        <span><i class="fas fa-eye text-green-400"></i> المعاينة المباشرة</span>
                        <button onclick="App.copyText()" class="text-xs bg-gray-700 px-2 py-1 rounded hover:bg-gray-600">نسخ</button>
                    </div>
                    <div id="preview-text" class="flex-1 overflow-y-auto p-5 text-base leading-loose bg-white font-serif text-justify whitespace-pre-wrap">
                        ${state.manualEdit || Compiler.generateRecordText(state)}
                    </div>
                </div>
            </div>
        `;
    };

    const render = () => {
        if (!StateEngine.get()) {
            renderArchive();
        } else {
            renderEditor();
        }
    };

    return { render };
})();

/**
 * -----------------------------------------------------------------------------
 * 7. APP CONTROLLER (Bridge)
 * -----------------------------------------------------------------------------
 */
window.App = {
    init: () => {
        StateEngine.subscribe(UIEngine.render);
        UIEngine.render(); // Load Archive first
    },
    
    navigateTo: (view) => {
        if(view === 'archive') {
            StateEngine.load(null); // Clear current state to show archive
            UIEngine.render();
        }
    },
    
    startNew: () => { StateEngine.initNew(); },
    
    // Inline HTML helpers
    updateMeta: (key, val) => {
        const s = StateEngine.get();
        s.meta[key] = val;
        StateEngine.load(s); // trigger update
    },
    updateParty: (id, key, val) => StateEngine.updateParty(id, key, val),
    updateAnswer: (id, key, val) => StateEngine.updateAnswer(id, key, val),
    
    setManualEdit: (text) => {
        const s = StateEngine.get();
        s.manualEdit = text;
        StateEngine.load(s);
    },
    clearManualEdit: () => {
        const s = StateEngine.get();
        s.manualEdit = null;
        StateEngine.load(s);
    },

    // Archive actions
    openRecord: async (id) => {
        const record = await DBManager.get(id);
        if(record) StateEngine.load(record);
    },
    deleteRecord: async (id) => {
        if(confirm("هل أنت متأكد من حذف المحضر بشكل نهائي؟")) {
            await DBManager.remove(id);
            Utils.showToast("تم الحذف بنجاح");
            UIEngine.render();
        }
    },

    // Export Actions
    copyText: () => {
        let text = document.getElementById('preview-text');
        if(!text) text = document.getElementById('final-text-area');
        if(!text) return;
        
        const val = text.value || text.innerText;
        navigator.clipboard.writeText(val).then(() => {
            Utils.showToast("تم النسخ إلى الحافظة");
        }).catch(() => alert("تعذر النسخ، يرجى التحديد يدوياً"));
    },
    
    exportPDF: () => {
        const element = document.getElementById('final-text-area');
        if(!element) return;
        
        // إنشاء عنصر مؤقت للطباعة للحفاظ على التنسيق
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = `<div style="font-family: 'Segoe UI', Arial; font-size: 16pt; line-height: 2; direction: rtl; text-align: justify; padding: 40px;">${element.value.replace(/\n/g, '<br>')}</div>`;
        
        const opt = {
            margin:       10,
            filename:     `محضر_جلسة_${StateEngine.get()?.meta.caseNum || 'بدون_رقم'}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(tempDiv).save();
        Utils.showToast("جاري تحميل PDF...");
    },

    exportBackup: async () => {
        const records = await DBManager.getAll();
        const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `نظام_المحاضر_نسخة_احتياطية_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
    },

    importBackup: (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if(!Array.isArray(data)) throw new Error();
                let count = 0;
                for(const rec of data) {
                    if(rec.id && rec.parties) {
                        await DBManager.save(rec);
                        count++;
                    }
                }
                Utils.showToast(`تم استيراد ${count} محضر بنجاح`);
                UIEngine.render();
            } catch(err) {
                alert("ملف غير صالح أو معطوب.");
            }
        };
        reader.readAsText(file);
    }
};

// Bootstrap App
window.addEventListener('DOMContentLoaded', App.init);

</script>
</body>
</html>
